# Cloudflare Tunnel の設定の見本。/etc/cloudflared/config.yml に置く（→ docs/deploy.md、ADR-0009）
# <TUNNEL_ID> と tsukena.example.com は、自分のものに置き換える
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # API だけを外に出す。Web 版のアプリは GitHub Pages に置く（→ ADR-0010）
  - hostname: tsukena.example.com
    service: http://127.0.0.1:8000
  - service: http_status:404
